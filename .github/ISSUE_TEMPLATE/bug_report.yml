name: Bug report
description: Something in procoder itself is broken — a crash, a wrong finding, a hook that doesn't fire.
labels: [bug]
body:
  - type: input
    id: procoder-version
    attributes:
      label: procoder version
      description: From `procoder version`, or `.claude-plugin/plugin.json`.
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Only relevant if this is a hook/skill issue rather than a CLI-only one.
      placeholder: "claude --version output, or N/A for CLI-only use"
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: "macOS 15 arm64 / Ubuntu 24.04 amd64 / Windows 11 amd64"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or moment
      description: The procoder command (`check`, `git`, `docs`, ...) or the hook moment (a Write of which file type) where it happened.
      placeholder: "procoder docs --external"
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: File or snippet
      description: The smallest file or code snippet that reproduces it. Paste it, don't just describe it.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the finding said (or what happened)
      description: Exact output — the finding text, the stack trace, or "nothing happened" if that's the bug.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
