name: False positive
description: procoder flagged code that is actually correct — this is the failure mode that matters most for a gate like this.
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        A false positive erodes trust in every other finding procoder reports, so
        these get priority. The more precisely you can pin down *why* the code is
        correct, the faster the detector can be fixed.
  - type: input
    id: procoder-version
    attributes:
      label: procoder version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: rule-id
    attributes:
      label: Rule id that fired
      description: Exactly as printed, e.g. `safe/hardcoded-secret` or `true/eslint:no-eval`.
      placeholder: "rung/rule-id"
    validations:
      required: true
  - type: textarea
    id: line
    attributes:
      label: The exact line (with a few lines of surrounding context)
      render: text
    validations:
      required: true
  - type: textarea
    id: why-correct
    attributes:
      label: Why this code is correct
      description: What makes this not an instance of the pattern the rule is trying to catch.
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - pragmatic
        - strict (default)
        - paranoid
    validations:
      required: true
