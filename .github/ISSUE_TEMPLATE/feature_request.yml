name: Feature request
description: Propose a new rule, command, platform, or capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing, and what does it cost you today?
      description: The gap, not the solution yet — a domain procoder doesn't cover, a platform it doesn't reach, a workflow it gets in the way of.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd want procoder to do instead. If it's a new check, which domain (security, formatting, git, ...) and roughly what it should catch.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing config (.procoder/config.toml, the rules files under .procoder/) that almost does this, or another tool that already covers it.
