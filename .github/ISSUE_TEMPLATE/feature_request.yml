name: Feature request
description: Propose a new rule, command, platform, or capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing, and what does it cost you today?
      description: The gap, not the solution yet — a rung procoder doesn't cover, a platform it doesn't reach, a workflow it gets in the way of.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd want procoder to do instead. If it's a new check, which rung (SAFE/TRUE/OBVIOUS/ALONE) and roughly what pattern.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing config (.procoder.toml, .procoderignore, a literal marker) that almost does this, or another tool that already covers it.
