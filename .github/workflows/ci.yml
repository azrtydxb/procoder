name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      # A red leg must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 gitleaks:allow
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 gitleaks:allow
        with:
          go-version-file: go.mod
      - name: gofmt is clean
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - run: go test ./internal/...
      - name: the binary builds
        run: go build ./cmd/procoder
      - name: dist binary matches the manifest version
        # the committed release binaries are hand-built; a version bump
        # that forgot the rebuild must fail here, not ship stale
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   bin=dist/linux-amd64/procoder;;
            Linux-ARM64) bin=dist/linux-arm64/procoder;;
            macOS-ARM64) bin=dist/darwin-arm64/procoder;;
            macOS-X64)   bin=dist/darwin-amd64/procoder;;
            Windows-X64) bin=dist/windows-amd64/procoder.exe;;
            *) echo "no dist binary for $RUNNER_OS-$RUNNER_ARCH"; exit 0;;
          esac
          want=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          got=$(./$bin version)
          test "$got" = "$want" || { echo "dist $bin says $got, manifest says $want — rebuild dist"; exit 1; }

  gate:
    # procoder's own gate over its own tree: the dogfood job. Formatting
    # gaps, git hygiene, and workflow lint all fail this leg.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 gitleaks:allow
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 gitleaks:allow
        with:
          go-version-file: go.mod
      - name: install the tools the gate needs
        run: |
          go build -o /usr/local/bin/procoder ./cmd/procoder
          # the runner's azure apt mirrors die for minutes at a time (two gate
          # runs burned their whole timeout on them). apt reads its mirrors
          # from /etc/apt/apt-mirrors.txt on these runners — rewriting the
          # sources files does nothing — so replace the mirror list itself
          # with the canonical archive, and fail fast if that also stalls
          echo "https://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99procoder-fastfail
          sudo apt-get update -q && sudo apt-get install -y -q shfmt shellcheck gitleaks
          # ruff: the Hermes adapter (__init__.py) makes this a Python-bearing
          # repo, so doctor requires the Python formatter too
          pip install semgrep ruff
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          npm install -g prettier @mermaid-js/mermaid-cli
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          pip install mkdocs-material
          # extracted OUTSIDE the workspace: the tarball carries its own docs,
          # and the docs report must only ever see this repository's files
          curl -sL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          sudo mv /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/
          sudo apt-get install -y -q universal-ctags
          go install github.com/scip-code/scip-go/cmd/scip-go@latest
          # gopls: doctor requires it on Go repos since index rename
          go install golang.org/x/tools/gopls@latest
          curl -sL https://github.com/sourcegraph/scip/releases/download/v0.9.0/scip-linux-amd64.tar.gz | tar xz -C /tmp scip
          sudo mv /tmp/scip /usr/local/bin/
      - name: puppeteer config for mmdc on a runner
        run: |
          echo "{\"executablePath\": \"$(which google-chrome)\", \"args\": [\"--no-sandbox\"], \"timeout\": 120000, \"protocolTimeout\": 180000}" > /tmp/puppeteer.json
          echo "PROCODER_PUPPETEER_CONFIG=/tmp/puppeteer.json" >> "$GITHUB_ENV"
      - name: doctor
        run: procoder doctor
      - name: gate over the tracked tree
        run: git ls-files | xargs procoder check
      - name: security, the deep pass
        run: procoder security --deep
      - name: documentation report, external links included
        run: procoder docs --external
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    # A tag is the release. Twenty-seven tags were pushed before this job
    # existed and only one GitHub Release was ever created by hand, which
    # left every "latest release" reader — the docs site header included —
    # stuck on a version from weeks earlier.
    #
    # Runs only after the suite and the gate pass on the tagged tree: the
    # Release is what people download, so it is published on the same
    # evidence everything else is.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 gitleaks:allow
      - name: the changelog entry is the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          # a release with empty notes is worse than a failed job: it looks
          # finished. procoder release already refuses to tag without the
          # entry, so its absence here means something went wrong.
          #
          # Test for content, not for size: a section of blank lines is a
          # non-empty file and would publish notes that say nothing.
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "no CHANGELOG.md entry for $version — refusing to publish empty release notes" >&2
            exit 1
          fi
          head -3 /tmp/notes.md
      - name: publish the release with the platform binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --latest \
            dist/darwin-arm64/procoder#procoder-darwin-arm64 \
            dist/darwin-amd64/procoder#procoder-darwin-amd64 \
            dist/linux-amd64/procoder#procoder-linux-amd64 \
            dist/linux-arm64/procoder#procoder-linux-arm64 \
            dist/windows-amd64/procoder.exe#procoder-windows-amd64.exe

  docs:
    # Build and publish the documentation site — domain 5's delivery leg.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 gitleaks:allow
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 gitleaks:allow
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: the changelog is one file, served twice
        run: cp CHANGELOG.md docs/changelog.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 gitleaks:allow
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 gitleaks:allow
        id: deployment
