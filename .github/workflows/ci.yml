name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      # A red leg must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt is clean
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - run: go test ./internal/...
      - name: the binary builds
        run: go build ./cmd/procoder

  gate:
    # procoder's own gate over its own tree: the dogfood job. Formatting
    # gaps, git hygiene, and workflow lint all fail this leg.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: install the tools the gate needs
        run: |
          go build -o /usr/local/bin/procoder ./cmd/procoder
          sudo apt-get update -q && sudo apt-get install -y -q shfmt shellcheck gitleaks
          pip install semgrep
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          npm install -g prettier @mermaid-js/mermaid-cli
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          pip install mkdocs-material
          # extracted OUTSIDE the workspace: the tarball carries its own docs,
          # and the docs report must only ever see this repository's files
          curl -sL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp
          sudo mv /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/
          sudo apt-get install -y -q universal-ctags
          go install github.com/scip-code/scip-go/cmd/scip-go@latest
          curl -sL https://github.com/sourcegraph/scip/releases/download/v0.9.0/scip-linux-amd64.tar.gz | tar xz -C /tmp scip
          sudo mv /tmp/scip /usr/local/bin/
      - name: puppeteer config for mmdc on a runner
        run: |
          echo "{\"executablePath\": \"$(which google-chrome)\", \"args\": [\"--no-sandbox\"], \"timeout\": 120000, \"protocolTimeout\": 180000}" > /tmp/puppeteer.json
          echo "PROCODER_PUPPETEER_CONFIG=/tmp/puppeteer.json" >> "$GITHUB_ENV"
      - name: doctor
        run: procoder doctor
      - name: gate over the tracked tree
        run: git ls-files | xargs procoder check
      - name: security, the deep pass
        run: procoder security --deep
      - name: documentation report, external links included
        run: procoder docs --external
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    # Build and publish the documentation site — domain 5's delivery leg.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: the changelog is one file, served twice
        run: cp CHANGELOG.md docs/changelog.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
