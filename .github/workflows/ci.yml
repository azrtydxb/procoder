name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      # A red leg must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt is clean
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - run: go test ./internal/...
      - name: the binary builds
        run: go build ./cmd/procoder

  gate:
    # procoder's own gate over its own tree: the dogfood job. Formatting
    # gaps, git hygiene, and workflow lint all fail this leg.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install the tools the gate needs
        run: |
          go build -o /usr/local/bin/procoder ./cmd/procoder
          sudo apt-get update -q && sudo apt-get install -y -q shfmt
          npm install -g prettier
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: doctor
        run: procoder doctor
      - name: gate over the tracked tree
        run: git ls-files | xargs procoder check
