name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      # A red leg must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # A shallow checkout, now that nothing here needs history. This job
      # used to fetch the whole repository so the reproducibility check
      # could rebuild dist/ at the commit that last touched it; that check
      # is gone with the committed binaries it existed to verify, and every
      # test that touches git builds its own repository in t.TempDir().
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
      # v6 is the first major that reads go.mod's toolchain directive; v5
      # matched only the `go` line and installed the newest patch of it, so
      # the pin in go.mod would have been ignored here. v6+ also exports
      # GOTOOLCHAIN=local, so no `go` command in the job can quietly fetch
      # a different compiler than the one this step installed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 gitleaks:allow
        with:
          go-version-file: go.mod
      - name: gofmt is clean
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - name: the prettier PHP plugin, so the P-CONTROL test runs instead of skipping
        # TestFormattingPHPNeverTouchesTheFile asserts the one thing PHP's
        # usual formatters cannot honour — printing without writing the file
        # — and it needs a real plugin to assert it against a real
        # formatter. Without this it skipped on every runner, which is a
        # guard that proves nothing while looking like one that does.
        #
        # Linux only: the assertion is about procoder's behaviour, not the
        # platform's, so running it on three would prove the same thing
        # three times and pay npm's install on each. node_modules is
        # gitignored, and doctor skips it.
        if: runner.os == 'Linux'
        run: |
          # Pinned from the same file the gate reads. Unpinned, an upstream
          # release overnight could change what this asserts or break the
          # job, which is the exact thing tool-versions.env exists to stop —
          # and it says so in its own opening paragraph.
          # eval rather than `. <(...)`: sourcing a process substitution
          # silently sets nothing under bash 3.2, so the pins would expand
          # empty and npm would install "prettier@" — a form that fails
          # loudly, but only after the reason for it has been hidden.
          eval "$(grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env)"
          npm install --no-save --no-fund --no-audit \
            "prettier@${PRETTIER}" "@prettier/plugin-php@${PRETTIER_PLUGIN_PHP}"
          # Read by the test: where the plugin is promised, skipping is a
          # failure. Otherwise a broken install would restore the silent
          # skip and the suite would stay green over the guard it disabled.
          echo "PROCODER_PHP_PLUGIN_REQUIRED=1" >> "$GITHUB_ENV"
      - run: go test ./internal/...
      - name: the binary builds
        run: go build ./cmd/procoder
      - name: the launcher resolves a binary in the shell this OS really uses
        # The Go test proves the case mapping with POSIX stubs and skips on
        # Windows, so without this step nothing exercises the path the
        # Windows fix exists for: GitHub's windows-latest runs `shell: bash`
        # as Git Bash, where uname reports MINGW64_NT and the launcher must
        # find procoder.exe.
        shell: bash
        run: |
          # Resolution is the whole question: does THIS shell's uname map to
          # a path the launcher finds and execs. A stub is planted at that
          # path first, so the step never reaches the fetch.
          #
          # It must never reach it. On a tag build this job runs BEFORE the
          # release job that publishes the assets, so a launcher left to
          # fetch would look for a release that does not exist yet and fail
          # every release — and would pass on pull requests only because the
          # PREVIOUS version's release happens to be published, which is a
          # green that depends on history rather than on this commit.
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) plat="windows-amd64"; ext=".exe" ;;
            Darwin) plat="darwin-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"; ext="" ;;
            *)      plat="linux-$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"; ext="" ;;
          esac
          mkdir -p "dist/$plat"
          printf '#!/bin/sh\nprintf "%%s\\n" stub-resolved\n' > "dist/$plat/procoder$ext"
          chmod +x "dist/$plat/procoder$ext"
          got=$(PROCODER_NO_FETCH=1 hooks/launcher.sh version) || { echo "the launcher failed under $(uname -s)"; exit 1; }
          test -n "$got" || { echo "the launcher printed nothing under $(uname -s)"; exit 1; }
          echo "launcher resolved procoder $got under $(uname -s)"
  gate:
    # procoder's own gate over its own tree: the dogfood job. Formatting
    # gaps, git hygiene, and workflow lint all fail this leg.
    runs-on: ubuntu-latest
    # Measured, not guessed: this job ran 8m53s and 9m10s on the two most
    # recent merges — 89% and 92% of a ten-minute budget — and timed out at
    # 10m09s on #228 inside `procoder security --deep`. A timeout surfaces
    # as `cancelled`, which is indistinguishable from a real failure at the
    # merge gate and sends whoever sees it hunting a defect that is not
    # there. Twenty gives the deep pass room to be slow without turning a
    # green tree red.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 gitleaks:allow
        with:
          go-version-file: go.mod
      - name: read the pinned tool versions
        # Only the assignments: GITHUB_ENV rejects anything that is not
        # KEY=VALUE, and the file leads with the paragraph explaining why the
        # pins exist at all.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env >> "$GITHUB_ENV"
      - name: the tools that have to be compiled, from cache when possible
        id: gotools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 gitleaks:allow
        with:
          # gopls and scip-go publish no binaries, so these are the only two
          # the gate still builds. Keyed on the versions file: bumping a line
          # there is what earns a rebuild, and nothing else does.
          path: ~/go/bin
          key: gate-gotools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}
      - name: python and node package caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 gitleaks:allow
        with:
          # mermaid-cli pulls puppeteer, which downloads a browser — and that
          # browser lands in ~/.cache/puppeteer, not in the npm cache. Caching
          # ~/.npm alone would have cached the small half and re-downloaded
          # the expensive one on every run.
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/puppeteer
          key: gate-pkgs-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}
      - name: the procoder binary the gate runs
        env:
          # setup-go exports GOTOOLCHAIN=local so nothing drifts off the pin,
          # but the two go-installed tools below are other people's modules:
          # gopls declares go 1.26, and `local` makes that a hard install
          # failure instead of a toolchain fetch. The pin governs what
          # compiles procoder; it has no business governing the linters.
          GOTOOLCHAIN: auto
        run: go build -o /usr/local/bin/procoder ./cmd/procoder
      - name: system packages
        run: |
          # the runner's azure apt mirrors die for minutes at a time (two gate
          # runs burned their whole timeout on them). apt reads its mirrors
          # from /etc/apt/apt-mirrors.txt on these runners — rewriting the
          # sources files does nothing — so replace the mirror list itself
          # with the canonical archive, and fail fast if that also stalls
          echo "https://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99procoder-fastfail
          sudo apt-get update -q
          # gitleaks is NOT here: apt ships whatever the distro froze (8.16.0
          # on noble), and the gate's secret verdict must not depend on that.
          # It is downloaded at the pinned version below, like the other
          # tools whose answers the gate reports.
          sudo apt-get install -y -q shfmt shellcheck universal-ctags
      # The versions are pinned, so a download that already happened has
      # nothing new to fetch. Suggested in #142, which was wrong about the
      # cost (measured: 1s on a healthy day) and right that a pinned
      # download repeated on every run is work with a known answer. The
      # value is on the bad day, when GitHub's release CDN is slow and the
      # gate is waiting on five sequential curls.
      - name: released binaries, from cache when the pins have not moved
        id: relbins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 gitleaks:allow
        with:
          path: /tmp/procoder-bins
          # The five pins this cache is made of, not the whole versions
          # file: keyed on the file, a RUFF or PRETTIER bump would throw
          # away five unchanged binaries and download them again, which
          # is not the "once per pin" this step claims to be.
          key: gate-relbins-${{ runner.os }}-${{ env.OSV_SCANNER }}-${{ env.GOLANGCI_LINT }}-${{ env.ACTIONLINT }}-${{ env.LYCHEE }}-${{ env.SCIP }}-${{ env.GITLEAKS }}
      - name: released binaries, downloaded rather than compiled
        if: steps.relbins.outputs.cache-hit != 'true'
        run: |
          # Each of these used to be `go install …@latest`, which compiled the
          # tool from source on every run — osv-scanner alone cost 92 seconds.
          # All three publish per-platform archives, so this is a download.
          mkdir -p /tmp/procoder-bins
          cd /tmp
          curl -sSfL -o /tmp/procoder-bins/osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER}/osv-scanner_linux_amd64"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz" | tar xz -C /tmp/procoder-bins gitleaks
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT}/golangci-lint-${GOLANGCI_LINT}-linux-amd64.tar.gz" | tar xz
          mv "golangci-lint-${GOLANGCI_LINT}-linux-amd64/golangci-lint" /tmp/procoder-bins/golangci-lint
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" | tar xz actionlint
          mv actionlint /tmp/procoder-bins/actionlint
          # extracted OUTSIDE the workspace: the tarball carries its own docs,
          # and the docs report must only ever see this repository's files
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          mv lychee-x86_64-unknown-linux-gnu/lychee /tmp/procoder-bins/lychee
          curl -sSfL "https://github.com/sourcegraph/scip/releases/download/v${SCIP}/scip-linux-amd64.tar.gz" | tar xz scip
          mv scip /tmp/procoder-bins/scip
      # Installed from the same place whether they were just downloaded or
      # restored, so the cached path is the one every run exercises. A file
      # the cache restored partially fails here rather than surfacing later
      # as a tool that is missing — `procoder doctor` runs next and would
      # say so, but a broken install should not get that far.
      - name: released binaries onto PATH
        run: |
          for b in osv-scanner gitleaks golangci-lint actionlint lychee scip; do
            test -s "/tmp/procoder-bins/$b" || { echo "$b missing from the binary cache" >&2; exit 1; }
            sudo install -m 0755 "/tmp/procoder-bins/$b" "/usr/local/bin/$b"
          done
      - name: the two tools with no published binary
        if: steps.gotools.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: auto
        run: |
          # proxy.golang.org drops a stream mid-download often enough to have
          # failed this job once already; these two are the only compiles left
          # and they run on a cache miss, so a retry costs nothing on the runs
          # that matter and saves a red gate on the ones that do not.
          install_tool() {
            for attempt in 1 2 3; do
              if go install "$1"; then return 0; fi
              echo "go install $1 failed (attempt $attempt)" >&2
              sleep 5
            done
            return 1
          }
          install_tool "github.com/scip-code/scip-go/cmd/scip-go@${SCIP_GO}"
          # gopls: doctor requires it on Go repos since index rename
          install_tool "golang.org/x/tools/gopls@${GOPLS}"
      - name: python and node tools
        run: |
          # ruff: the Hermes adapter (__init__.py) makes this a Python-bearing
          # repo, so doctor requires the Python formatter too
          pip install "semgrep==${SEMGREP}" "ruff==${RUFF}" "mkdocs-material==${MKDOCS_MATERIAL}"
          # eslint: this repository ships three JS host adapters, and until
          # a linter that could not run started failing the gate, none of
          # them had ever been linted here — the gate reported clean over
          # them because eslint was simply absent.
          npm install -g "prettier@${PRETTIER}" "eslint@${ESLINT}" "@mermaid-js/mermaid-cli@${MERMAID_CLI}"
      - name: put the go tool directory on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: puppeteer config for mmdc on a runner
        run: |
          echo "{\"executablePath\": \"$(which google-chrome)\", \"args\": [\"--no-sandbox\"], \"timeout\": 120000, \"protocolTimeout\": 180000}" > /tmp/puppeteer.json
          echo "PROCODER_PUPPETEER_CONFIG=/tmp/puppeteer.json" >> "$GITHUB_ENV"
      # What this runner actually has. Two concurrency changes (#237, #240)
      # cut the gate's wall time substantially on a ten-core laptop and did
      # nothing measurable here, and the standing explanation is that the
      # work is CPU-bound with no spare cores to fan out into. That was a
      # hypothesis nobody could check, because nothing recorded the machine
      # the number came from. One line, so the next person comparing a
      # local timing against a CI one knows what they are comparing.
      - name: what this runner has
        run: |
          echo "cores: $(nproc)"
          echo "memory: $(free -g 2>/dev/null | awk '/^Mem:/{print $2 " GB"}')"
      - name: doctor
        run: procoder doctor
      # One invocation, not a pipeline into xargs. xargs splits a long
      # list into batches and runs the command once per batch, and each
      # run pays a full semgrep and osv-scanner pass while reporting as
      # though it were the only one. 787 files fits in a single batch
      # today — silently, and only until it does not.
      - name: gate over the tracked tree
        run: git ls-files | procoder check --paths-from -
      - name: documentation report, external links included
        run: procoder docs --external
        env:
          GH_TOKEN: ${{ github.token }}
      # Credits, enforced here rather than trusted to whoever cuts the
      # release. The rule ran only when somebody typed `procoder release`
      # on their own machine — which means it ran when they remembered,
      # and "remember to check" is the thing that kept failing and is why
      # the rule exists at all. Needs the API, so it needs the token; the
      # step above already established that pattern.
      - name: every contributor the newest changelog entry owes is credited
        run: procoder release --credits
        env:
          GH_TOKEN: ${{ github.token }}
      - name: the whole-tree pass — maintain, debt, deps
        # The gate answers about the change; these answer about the
        # repository. Dependency freshness, the debt ledger and complexity
        # across a codebase are properties of the tree, and asking them of
        # every commit would either report the same finding forever or
        # rescan everything each time somebody edits a line.
        #
        # Until now they ran nowhere unless a person typed them, which
        # meant they protected whoever already knew they existed.
        run: |
          procoder maintain
          procoder debt
          procoder deps

  release:
    # A tag is the release. Twenty-seven tags were pushed before this job
    # existed and only one GitHub Release was ever created by hand, which
    # left every "latest release" reader — the docs site header included —
    # stuck on a version from weeks earlier.
    #
    # Runs only after the suite and the gate pass on the tagged tree: the
    # Release is what people download, so it is published on the same
    # evidence everything else is.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
        with:
          # The notes below name the previous tag to build a compare link,
          # and a depth-1 checkout of a tag ref carries no other tag to
          # compare against. The link would simply be missing — the guard
          # there is written so it never comes out wrong — but missing is
          # the whole point of adding it.
          fetch-depth: 0
      - name: the changelog entry is the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          # a release with empty notes is worse than a failed job: it looks
          # finished. procoder release already refuses to tag without the
          # entry, so its absence here means something went wrong.
          #
          # Test for content, not for size: a section of blank lines is a
          # non-empty file and would publish notes that say nothing.
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "no CHANGELOG.md entry for $version — refusing to publish empty release notes" >&2
            exit 1
          fi

          # The prose says what changed; this says what to do about it.
          # Without it the release page is five identical-looking binaries
          # and no statement of which one, how to verify it, or that
          # upgrading in place is a thing procoder does for you.
          #
          # The previous tag is found by walking the tag list rather than
          # asking git for "the parent": tags are not ordered by ancestry,
          # and a compare link built from the wrong end reads as though the
          # release contained everything ever done.
          prev=$(git tag --list 'v*' --sort=-version:refname | grep -A1 -x "$GITHUB_REF_NAME" | tail -1)
          {
            echo
            echo "---"
            echo
            echo "**Upgrade in place:** \`procoder self-upgrade\` — it asks first, and installs"
            echo "only after the download matches the \`SHA256SUMS\` published below."
            echo
            echo "**Or download** the binary for your platform below and check it against"
            echo "\`SHA256SUMS\` before running it."
          } >> /tmp/notes.md
          # A first release has no previous tag, and grep -A1 then returns
          # the tag itself: a compare of a tag with itself is an empty diff
          # presented as the release contents, so it is left out instead.
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_REF_NAME" ]; then
            {
              echo
              echo "**Every commit in this release:**"
              echo "https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            } >> /tmp/notes.md
          fi
          cat /tmp/notes.md
      - name: build the binaries this release publishes
        env:
          # The pinned toolchain builds what people download, the same way
          # it builds what the tests run against.
          GOTOOLCHAIN: local
        run: |
          # BUILT here, not copied from the tree. They used to be committed,
          # which cost 39MB of history per release and shipped the previous
          # version's binaries once — every manifest green, the gate green,
          # and the plugin installing something that reported one version
          # and behaved like another. Nothing is built by a person any more.
          ./scripts/build-dist.sh
      - name: stage the binaries under names that do not collide
        run: |
          # gh takes an asset's NAME from the file name; `path#text` sets only
          # its display label. Five files all called `procoder` therefore
          # upload as five assets called `procoder`, and the second one fails.
          # cleared, not just created: a reused workspace could leave files
          # behind and the count would then pass or fail for the wrong reason
          rm -rf /tmp/assets
          mkdir -p /tmp/assets
          cp dist/darwin-arm64/procoder      /tmp/assets/procoder-darwin-arm64
          cp dist/darwin-amd64/procoder      /tmp/assets/procoder-darwin-amd64
          cp dist/linux-amd64/procoder       /tmp/assets/procoder-linux-amd64
          cp dist/linux-arm64/procoder       /tmp/assets/procoder-linux-arm64
          cp dist/windows-amd64/procoder.exe /tmp/assets/procoder-windows-amd64.exe
          # five files, five distinct names, or the upload is not worth trying
          count=$(find /tmp/assets -type f -exec basename {} \; | sort -u | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "expected 5 distinctly named assets, staged $count" >&2
            find /tmp/assets -type f -exec ls -l {} + >&2
            exit 1
          fi
          # After the count, so the check above keeps meaning "five binaries".
          # Every launcher on every machine verifies its download against
          # this file and refuses to run anything that does not match, so a
          # release without it is a release nobody can install — not merely
          # one nobody can upgrade to, which is what it used to mean.
          cp dist/SHA256SUMS /tmp/assets/SHA256SUMS
          # Non-empty, and the right size. An empty or truncated manifest
          # publishes a release that looks finished and fails every install,
          # which is worse than a red job somebody has to look at.
          lines=$(grep -c . /tmp/assets/SHA256SUMS || true)
          if [ "${lines:-0}" -ne 5 ]; then
            echo "SHA256SUMS has $lines line(s), expected 5 — refusing to publish" >&2
            cat /tmp/assets/SHA256SUMS >&2
            exit 1
          fi
          find /tmp/assets -type f -exec ls -l {} +
      - name: publish the release with the platform binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --latest \
            /tmp/assets/procoder-darwin-arm64 \
            /tmp/assets/procoder-darwin-amd64 \
            /tmp/assets/procoder-linux-amd64 \
            /tmp/assets/procoder-linux-arm64 \
            /tmp/assets/procoder-windows-amd64.exe \
            /tmp/assets/SHA256SUMS

  docs:
    # Build and publish the documentation site — domain 5's delivery leg.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 gitleaks:allow
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: the changelog is one file, served twice
        run: cp CHANGELOG.md docs/changelog.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5 gitleaks:allow
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5 gitleaks:allow
        id: deployment
