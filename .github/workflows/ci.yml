name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      # A red leg must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
        with:
          # The reproducibility check below rebuilds dist/ at the commit that
          # last touched it, which a depth-1 checkout does not contain.
          fetch-depth: 0
      # v6 is the first major that reads go.mod's toolchain directive; v5
      # matched only the `go` line and installed the newest patch of it, so
      # the pin in go.mod would have been ignored here. v6+ also exports
      # GOTOOLCHAIN=local, so no `go` command in the job can quietly fetch
      # a different compiler than the one this step installed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 gitleaks:allow
        with:
          go-version-file: go.mod
      - name: gofmt is clean
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./cmd/... ./internal/...
      - run: go test ./internal/...
      - name: the binary builds
        run: go build ./cmd/procoder
      - name: the launcher resolves a binary in the shell this OS really uses
        # The Go test proves the case mapping with POSIX stubs and skips on
        # Windows, so without this step nothing exercises the path the
        # Windows fix exists for: GitHub's windows-latest runs `shell: bash`
        # as Git Bash, where uname reports MINGW64_NT and the launcher must
        # find procoder.exe.
        shell: bash
        run: |
          # Resolution is the whole question: the launcher runs the COMMITTED
          # dist binary, whose version is deliberately not the source's and
          # is checked against the manifest by the next step. What must hold
          # here is that this shell's uname resolves to a binary at all.
          got=$(hooks/launcher.sh version) || { echo "the launcher failed under $(uname -s)"; exit 1; }
          test -n "$got" || { echo "the launcher printed nothing under $(uname -s)"; exit 1; }
          echo "launcher resolved procoder $got under $(uname -s)"
      - name: the committed binaries rebuild from their source
        # The version-string check this replaces proved a binary printed the
        # expected string. It did not prove the binary came from the tree it
        # claims — and the plugin auto-executes these on every session start,
        # every Bash call and every Write. Rebuilding and comparing digests is
        # the difference between trusting the committer and checking.
        #
        # The rebuild happens at the commit that last touched dist/, not at
        # HEAD. dist/ is refreshed at release, so between releases it lags
        # main by design: comparing it against HEAD would demand 35MB of
        # rebuilt binaries in every feature branch and would turn a real
        # check into a chore people learn to re-run without reading. What
        # matters is that the committed digests are reproducible from the
        # source they were built from, and that is what this checks.
        #
        # Linux only: one cross-compiling host covers all five targets, and
        # running it on three would compare the same bytes three times.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          commit=$(git log -1 --format=%H -- dist/)
          if [ -z "$commit" ]; then
            echo "no commit in history touches dist/ — cannot verify the binaries" >&2
            exit 1
          fi
          echo "dist/ was last built at $commit"
          tree=$(mktemp -d)
          git worktree add --detach "$tree" "$commit" >/dev/null
          recorded=$(git show "$commit:dist/SHA256SUMS")
          (cd "$tree" && ./scripts/build-dist.sh >/dev/null)
          if ! diff <(echo "$recorded") "$tree/dist/SHA256SUMS"; then
            echo "dist/ does not rebuild from $commit — run scripts/build-dist.sh and commit the result" >&2
            exit 1
          fi
          echo "all five binaries rebuild byte-for-byte from $commit"

  gate:
    # procoder's own gate over its own tree: the dogfood job. Formatting
    # gaps, git hygiene, and workflow lint all fail this leg.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 gitleaks:allow
        with:
          go-version-file: go.mod
      - name: read the pinned tool versions
        # Only the assignments: GITHUB_ENV rejects anything that is not
        # KEY=VALUE, and the file leads with the paragraph explaining why the
        # pins exist at all.
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/tool-versions.env >> "$GITHUB_ENV"
      - name: the tools that have to be compiled, from cache when possible
        id: gotools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 gitleaks:allow
        with:
          # gopls and scip-go publish no binaries, so these are the only two
          # the gate still builds. Keyed on the versions file: bumping a line
          # there is what earns a rebuild, and nothing else does.
          path: ~/go/bin
          key: gate-gotools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}
      - name: python and node package caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6 gitleaks:allow
        with:
          # mermaid-cli pulls puppeteer, which downloads a browser — and that
          # browser lands in ~/.cache/puppeteer, not in the npm cache. Caching
          # ~/.npm alone would have cached the small half and re-downloaded
          # the expensive one on every run.
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/puppeteer
          key: gate-pkgs-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}
      - name: the procoder binary the gate runs
        env:
          # setup-go exports GOTOOLCHAIN=local so nothing drifts off the pin,
          # but the two go-installed tools below are other people's modules:
          # gopls declares go 1.26, and `local` makes that a hard install
          # failure instead of a toolchain fetch. The pin governs what
          # compiles procoder; it has no business governing the linters.
          GOTOOLCHAIN: auto
        run: go build -o /usr/local/bin/procoder ./cmd/procoder
      - name: system packages
        run: |
          # the runner's azure apt mirrors die for minutes at a time (two gate
          # runs burned their whole timeout on them). apt reads its mirrors
          # from /etc/apt/apt-mirrors.txt on these runners — rewriting the
          # sources files does nothing — so replace the mirror list itself
          # with the canonical archive, and fail fast if that also stalls
          echo "https://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99procoder-fastfail
          sudo apt-get update -q
          sudo apt-get install -y -q shfmt shellcheck gitleaks universal-ctags
      - name: released binaries, downloaded rather than compiled
        run: |
          # Each of these used to be `go install …@latest`, which compiled the
          # tool from source on every run — osv-scanner alone cost 92 seconds.
          # All three publish per-platform archives, so this is a download.
          cd /tmp
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER}/osv-scanner_linux_amd64"
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT}/golangci-lint-${GOLANGCI_LINT}-linux-amd64.tar.gz" | tar xz
          sudo install -m 0755 "golangci-lint-${GOLANGCI_LINT}-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" | tar xz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          # extracted OUTSIDE the workspace: the tarball carries its own docs,
          # and the docs report must only ever see this repository's files
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE}/lychee-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo install -m 0755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          curl -sSfL "https://github.com/sourcegraph/scip/releases/download/v${SCIP}/scip-linux-amd64.tar.gz" | tar xz scip
          sudo install -m 0755 scip /usr/local/bin/scip
      - name: the two tools with no published binary
        if: steps.gotools.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: auto
        run: |
          # proxy.golang.org drops a stream mid-download often enough to have
          # failed this job once already; these two are the only compiles left
          # and they run on a cache miss, so a retry costs nothing on the runs
          # that matter and saves a red gate on the ones that do not.
          install_tool() {
            for attempt in 1 2 3; do
              if go install "$1"; then return 0; fi
              echo "go install $1 failed (attempt $attempt)" >&2
              sleep 5
            done
            return 1
          }
          install_tool "github.com/scip-code/scip-go/cmd/scip-go@${SCIP_GO}"
          # gopls: doctor requires it on Go repos since index rename
          install_tool "golang.org/x/tools/gopls@${GOPLS}"
      - name: python and node tools
        run: |
          # ruff: the Hermes adapter (__init__.py) makes this a Python-bearing
          # repo, so doctor requires the Python formatter too
          pip install "semgrep==${SEMGREP}" "ruff==${RUFF}" "mkdocs-material==${MKDOCS_MATERIAL}"
          npm install -g "prettier@${PRETTIER}" "@mermaid-js/mermaid-cli@${MERMAID_CLI}"
      - name: put the go tool directory on PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: puppeteer config for mmdc on a runner
        run: |
          echo "{\"executablePath\": \"$(which google-chrome)\", \"args\": [\"--no-sandbox\"], \"timeout\": 120000, \"protocolTimeout\": 180000}" > /tmp/puppeteer.json
          echo "PROCODER_PUPPETEER_CONFIG=/tmp/puppeteer.json" >> "$GITHUB_ENV"
      - name: doctor
        run: procoder doctor
      - name: gate over the tracked tree
        run: git ls-files | xargs procoder check
      - name: security, the deep pass
        run: procoder security --deep
      - name: documentation report, external links included
        run: procoder docs --external
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    # A tag is the release. Twenty-seven tags were pushed before this job
    # existed and only one GitHub Release was ever created by hand, which
    # left every "latest release" reader — the docs site header included —
    # stuck on a version from weeks earlier.
    #
    # Runs only after the suite and the gate pass on the tagged tree: the
    # Release is what people download, so it is published on the same
    # evidence everything else is.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
        with:
          # The notes below name the previous tag to build a compare link,
          # and a depth-1 checkout of a tag ref carries no other tag to
          # compare against. The link would simply be missing — the guard
          # there is written so it never comes out wrong — but missing is
          # the whole point of adding it.
          fetch-depth: 0
      - name: the changelog entry is the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          # a release with empty notes is worse than a failed job: it looks
          # finished. procoder release already refuses to tag without the
          # entry, so its absence here means something went wrong.
          #
          # Test for content, not for size: a section of blank lines is a
          # non-empty file and would publish notes that say nothing.
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "no CHANGELOG.md entry for $version — refusing to publish empty release notes" >&2
            exit 1
          fi

          # The prose says what changed; this says what to do about it.
          # Without it the release page is five identical-looking binaries
          # and no statement of which one, how to verify it, or that
          # upgrading in place is a thing procoder does for you.
          #
          # The previous tag is found by walking the tag list rather than
          # asking git for "the parent": tags are not ordered by ancestry,
          # and a compare link built from the wrong end reads as though the
          # release contained everything ever done.
          prev=$(git tag --list 'v*' --sort=-version:refname | grep -A1 -x "$GITHUB_REF_NAME" | tail -1)
          {
            echo
            echo "---"
            echo
            echo "**Upgrade in place:** \`procoder self-upgrade\` — it asks first, and installs"
            echo "only after the download matches the \`SHA256SUMS\` published below."
            echo
            echo "**Or download** the binary for your platform below and check it against"
            echo "\`SHA256SUMS\` before running it."
          } >> /tmp/notes.md
          # A first release has no previous tag, and grep -A1 then returns
          # the tag itself: a compare of a tag with itself is an empty diff
          # presented as the release contents, so it is left out instead.
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_REF_NAME" ]; then
            {
              echo
              echo "**Every commit in this release:**"
              echo "https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
            } >> /tmp/notes.md
          fi
          cat /tmp/notes.md
      - name: stage the binaries under names that do not collide
        run: |
          # gh takes an asset's NAME from the file name; `path#text` sets only
          # its display label. Five files all called `procoder` therefore
          # upload as five assets called `procoder`, and the second one fails.
          # cleared, not just created: a reused workspace could leave files
          # behind and the count would then pass or fail for the wrong reason
          rm -rf /tmp/assets
          mkdir -p /tmp/assets
          cp dist/darwin-arm64/procoder      /tmp/assets/procoder-darwin-arm64
          cp dist/darwin-amd64/procoder      /tmp/assets/procoder-darwin-amd64
          cp dist/linux-amd64/procoder       /tmp/assets/procoder-linux-amd64
          cp dist/linux-arm64/procoder       /tmp/assets/procoder-linux-arm64
          cp dist/windows-amd64/procoder.exe /tmp/assets/procoder-windows-amd64.exe
          # five files, five distinct names, or the upload is not worth trying
          count=$(find /tmp/assets -type f -exec basename {} \; | sort -u | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "expected 5 distinctly named assets, staged $count" >&2
            find /tmp/assets -type f -exec ls -l {} + >&2
            exit 1
          fi
          # After the count, so the check above keeps meaning "five binaries".
          # self-upgrade verifies every download against this file and refuses
          # to install without it: a release published without SHA256SUMS is a
          # release nobody can upgrade to.
          cp dist/SHA256SUMS /tmp/assets/SHA256SUMS
          find /tmp/assets -type f -exec ls -l {} +
      - name: publish the release with the platform binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --latest \
            /tmp/assets/procoder-darwin-arm64 \
            /tmp/assets/procoder-darwin-amd64 \
            /tmp/assets/procoder-linux-amd64 \
            /tmp/assets/procoder-linux-arm64 \
            /tmp/assets/procoder-windows-amd64.exe \
            /tmp/assets/SHA256SUMS

  docs:
    # Build and publish the documentation site — domain 5's delivery leg.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 gitleaks:allow
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 gitleaks:allow
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: the changelog is one file, served twice
        run: cp CHANGELOG.md docs/changelog.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5 gitleaks:allow
        with:
          path: site
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5 gitleaks:allow
        id: deployment
