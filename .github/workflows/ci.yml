name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Drift check runs first: it must judge the committed tree, never a tree
      # some later step regenerated.
      - name: Generated rule files must match the doctrine
        run: npm run sync:check
      - run: npm test
      # The gate applies to the gate. Fix the source when this fails; do not
      # baseline procoder's own findings or widen an exclusion to cover them.
      - name: procoder checks itself
        run: node bin/procoder.js check hooks bin scripts
