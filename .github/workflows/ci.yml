name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Drift check runs first: it must judge the committed tree, never a tree
      # some later step regenerated.
      - name: Generated rule files must match the doctrine
        run: npm run sync:check
      # The gate applies to the gate — tests/dogfood.test.js runs procoder over
      # the whole tracked tree and is part of this run. There used to be a
      # separate `procoder check hooks bin scripts` step here; it was a second,
      # narrower list of what the tool must pass, and two lists drift. Fix the
      # source when the dogfood test fails; do not baseline procoder's own
      # findings or widen a hold-out to cover them.
      - run: npm test
