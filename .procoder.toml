[exclude]
# Every entry here is scoped to the files that actually earn it, and each one is
# checked on every `verify` — a pattern whose path is gone, that matches no file,
# or all of whose files are clean is reported and fails `--unused-exclusions`.
# This list was four times longer until that check existed to judge it:
#
#   dropped  AGENTS.md, .cursor/, .windsurf/, .clinerules/, .kiro/, .qoder/,
#            .agents/ — 7 generated rule files, excluded on the "it is
#            generated" argument and holding back nothing at all. They are
#            rendered from skills/procoder/SKILL.md, which is itself in the
#            gate, so the markers that keep the source clean render into them
#            too and gating the copies costs nothing. If a future SKILL.md edit
#            reddens one of them, the fix is a marker in SKILL.md, not an
#            exclusion here; `npm run sync` re-renders.
#   narrowed .opencode/ and .openclaw/ (25 files) → the two rot.md renders. One
#            finding each, both the same false positive: sync-rules.js renders a
#            `description:` frontmatter line from commands/rot.toml reading
#            "…stale, and deprecated code…", which alone/deprecated-no-trigger  # procoder: literal alone/deprecated-no-trigger this line quotes the text that trips the rule
#            reads as a deprecation notice. The other 23 renders are gated.
#            Delete these two the day the renderer or the .toml carries a marker.
#   narrowed tests/fixtures/ (14 files) → the 7 dirty.* alone. The clean.*
#            fixtures were excluded by association and are clean under the whole
#            engine, so all 7 are now gated for free. ts/clean.ts was the one
#            exception — its prose block of "never db.query(`…`)" lines read as
#            commented-out code — and it now carries the line marker that is the
#            right instrument for it, so it is gated too.
#
# The dirty.* fixtures stay: they are inputs whose whole purpose is to be
# scanned by the tests, not by the scan. A marker in them would change the input
# and break the test that reads them, so this is the one case the line marker
# cannot serve.
#
# examples/*/before.* is deliberately NOT listed here, though it is the obvious
# candidate: those files violate a rung on purpose, paired with an after.* that
# does not. The reason is mechanical, not stylistic — checkFile() applies these
# path exclusions itself, so listing examples/ makes `procoder check
# examples/safe/before.ts` report nothing, and tests/examples.test.js asserts
# exactly the opposite (verified: it fails with "before.ts does not trip SAFE").
# An exclusion here would delete the teaching material's only proof that it
# still teaches. The examples tree is held out of the self-scan in
# tests/dogfood.test.js instead, where it is one line with a reason next to it
# and the real `procoder check` still sees the files.
# Empty, and that is a result rather than an oversight. All three entries that
# used to live here were removed when the rules that needed them were deleted:
#
#   tests/fixtures/*/dirty.*   the fixtures existed to feed the language packs.
#                              The packs are gone, nothing read the fixtures any
#                              more, and dead inputs are a rung-4 finding about
#                              procoder itself — so they were deleted, not
#                              excluded.
#   .opencode/…/rot.md         both excluded one rendered `description:` line
#   .openclaw/…/rot.md         that alone/deprecated-no-trigger read as a
#                              deprecation notice. That rule was procoder's own
#                              and no longer exists; no analyzer replaces it, so
#                              the files are gated for free.
#
# `verify --unused-exclusions` is what found all three. An exclusion nobody
# re-judges silently covers whatever lands there next.
paths = []

# No rule exclusions. The three that used to exempt hooks/checks/patterns/
# markers.js are gone: that file now carries a line marker on each of the eleven
# lines that needed one, naming the single rule it describes. That says the same
# thing per line instead of per file, is visible where the line is rather than
# in config, and generalises — the same marker covers the skills, the tests and
# this file, which a per-file exclusion could not.
# Analyzer rules judged inapplicable to this project are recorded in
# eslint.config.mjs, next to the configuration that enables the rest — a
# judgement about a RULE belongs where the rule is turned on, and this list is
# deliberately not widenable to a tree (see parseRuleExclusions in config.js).
rules = []
