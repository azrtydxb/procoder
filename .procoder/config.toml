# procoder configuration — every knob the harness reads lives here (D-HOME).

[git]
# What happens when work lands directly on the default branch:
#   "report" (default) — the agent is told; branching stays its decision
#   "block"            — the gate fails until the work moves to a branch
default_branch_policy = "report"

# Files larger than this (MB) block the gate — large artifacts belong in
# releases or LFS, not in history. Raised from the default 5 because this
# repository IS a binary distribution: the plugin execs dist/<platform>/
# procoder on every session start, so those five files are the product,
# not an artifact somebody forgot to gitignore. They crossed 5 MB when the
# copilot-leak and self-update packages landed. The rule still holds for
# everything else, which is why this is a number and not an exemption.
max_file_mb = 10

[test]
# The suite verdict joins the close controllers: todo close and
# backlog story close refuse while `procoder test` is red.
policy = "block"

[release]
# The version-bearing files `procoder release` verifies stay in sync.
files = ["plugin.yaml", "package.json", "gemini-extension.json", "README.md", ".claude-plugin/plugin.json", "docs/index.md", ".github/plugin/marketplace.json", ".codex-plugin/plugin.json", ".github/plugin/plugin.json"]

[bench]
# Benchmark regressions beyond this percentage are marked and exit 1.
threshold = 10

[docs]
# The documentation obligation blocks the gate: a public-surface change
# with no documentation change must be answered, not skipped.
policy = "block"
