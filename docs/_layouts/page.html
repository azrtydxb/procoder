<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.pagetitle }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="stylesheet" href="assets/procoder.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  {% include nav.html %}
  <main class="content" id="main" tabindex="-1">
    <!-- Badges, drawn rather than fetched. A shields.io image would be one
         external request per badge on a site whose whole claim is that it makes
         none, from a tool whose first rung calls a new dependency a new trust
         boundary. Every value here is a fact of the release, not a status that
         can change between builds: a CI badge belongs on the README, where
         GitHub serves it from the workflow itself. -->
    <ul class="badges" aria-label="Release facts">
      <li class="badge"><span class="badge-k">version</span><span class="badge-v">{{ site.version }}</span></li>
      <li class="badge"><span class="badge-k">licence</span><span class="badge-v">Apache-2.0</span></li>
      <li class="badge"><span class="badge-k">node</span><span class="badge-v">≥ 18</span></li>
      <li class="badge"><span class="badge-k">runtime deps</span><span class="badge-v">0</span></li>
    </ul>
    {{ content }}
    <footer class="foot">
      <p>No fonts, no analytics, no scripts. This page makes no external request.</p>
    </footer>
  </main>
</div>
</body>
</html>
