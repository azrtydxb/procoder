site_name: procoder
site_description: A harness that makes AI coders work like senior developers.
site_url: https://azrtydxb.github.io/procoder/
repo_url: https://github.com/azrtydxb/procoder

theme:
  name: material
  # the icon, never the full lockup: at header size the wordmark is
  # unreadable and the site name already carries it
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: light mode
  features:
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - The quality chain: quality-chain.md
  - The ten domains: domains.md
  - Commands: commands.md
  - Configuration: configuration.md
  - Workflow: workflow.md
  - Every agent: portability.md
  - Architecture: architecture.md
  - Influences: influences.md
  - Changelog: changelog.md
