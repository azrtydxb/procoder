site_name: procoder
site_description: A harness that makes AI coders work like senior developers.
site_url: https://azrtydxb.github.io/procoder/
repo_url: https://github.com/azrtydxb/procoder

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - The nine domains: domains.md
  - Commands: commands.md
  - Configuration: configuration.md
  - Workflow: workflow.md
  - Every agent: portability.md
  - Changelog: changelog.md
