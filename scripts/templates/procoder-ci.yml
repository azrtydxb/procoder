# procoder CI guard. Copy to .github/workflows/procoder.yml
name: procoder
on: [push, pull_request]

jobs:
  procoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history: --since resolves a ref, and a shallow clone has
          # nothing to resolve it against.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install procoder
        run: npm install -g procoder

      # --since does the diff itself, so there is no shell splitting a file list
      # on whitespace and no `|| true` turning a failed git command into an
      # empty one. A ref it cannot resolve exits 2 and fails the job, instead of
      # checking nothing and passing green.
      - name: Check changed files
        run: procoder check --since "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"

      # SARIF puts every finding on the diff of the pull request that introduced
      # it, and carries procoder's own fingerprint so a moved line is not a new
      # alert. Needs `permissions: security-events: write` on the job.
      #
      # - name: Upload findings to code scanning
      #   run: procoder check --since "$BASE" --format sarif > procoder.sarif
      # - uses: github/codeql-action/upload-sarif@v3
      #   with: { sarif_file: procoder.sarif }

      # The ratchet compares fingerprints, not counts: fixing an old finding
      # buys no room for a new one. Never replace this with a count comparison.
      - name: Ratchet — accepted debt may shrink, never grow
        if: hashFiles('.procoder-baseline.json') != ''
        run: procoder verify .
